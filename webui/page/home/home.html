<div class="body-content constant-height">
    <!-- Status box: tap to see the full enabled-features breakdown -->
    <div class="box translucent status-box" id="status-box">
        <md-ripple></md-ripple>
        <div class="status-row">
            <div class="status-dot" id="status-dot"></div>
            <div class="status-text-group">
                <h2 id="status-header" data-i18n="status_title"></h2>
                <p id="status-text">Checking SuSFS…</p>
            </div>
            <md-icon class="status-chevron">
                <svg xmlns="http://www.w3.org/2000/svg" height="22px" viewBox="0 -960 960 960" width="22px"><path d="M504-480 320-664l56-56 240 240-240 240-56-56 184-184Z"/></svg>
            </md-icon>
        </div>
        <div class="status-meta">
            <span id="status-kernel-version"></span>
            <span id="status-feature-count"></span>
        </div>
    </div>

    <div class="box translucent support-card" id="support-card">
        <div class="support-card-row">
            <md-icon class="support-card-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="m480-121-41-37q-105-96-173.5-167T160-451q-40-51-56-95.5T88-637q0-90 60.5-150.5T299-848q57 0 106 26.5t75 75.5q26-49 75-75.5T661-848q90 0 150.5 60.5T872-637q0 47-16 91.5T800-450q-40 47-108.5 118T523-158l-43 37Z"/></svg>
            </md-icon>
            <span class="support-card-text" data-i18n="donate_home_hint"></span>
            <md-icon-button class="support-card-close" id="support-card-close" title="Dismiss">
                <md-icon>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/></svg>
                </md-icon>
            </md-icon-button>
        </div>
        <div class="support-card-address">
            <span class="copy-link" id="support-address-text">TCyghELuquAtoUFdY65iuJSMqJXbYhWidA</span>
        </div>
    </div>

    <div class="box translucent summary-box" id="summary-box">
        <h2 data-i18n="summary_title"></h2>
        <div class="summary-grid" id="summary-grid">
            <!-- populated by home.js -->
        </div>
        <p class="summary-hint" data-i18n="summary_hint"></p>
    </div>

    <!-- Backup and restore, quick access from home -->
    <div class="box translucent backup-card" id="backup-card">
        <h2 data-i18n="backup_restore_backup_and_restore"></h2>
        <div class="backup-card-row">
            <md-filled-tonal-button id="home-export-btn">
                <md-icon slot="icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="M820-671.54v459.23Q820-182 799-161q-21 21-51.31 21H212.31Q182-140 161-161q-21-21-21-51.31v-535.38Q140-778 161-799q21-21 51.31-21h459.23L820-671.54ZM760-646 646-760H212.31q-5.39 0-8.85 3.46t-3.46 8.85v535.38q0 5.39 3.46 8.85t8.85 3.46h535.38q5.39 0 8.85-3.46t3.46-8.85V-646ZM480-269.23q41.54 0 70.77-29.23Q580-327.69 580-369.23q0-41.54-29.23-70.77-29.23-29.23-70.77-29.23-41.54 0-70.77 29.23Q380-410.77 380-369.23q0 41.54 29.23 70.77 29.23 29.23 70.77 29.23ZM255.39-564.62h328.45v-139.99H255.39v139.99ZM200-646v446-560 114Z"/></svg>
                </md-icon>
                <span data-i18n="backup_restore_export"></span>
            </md-filled-tonal-button>
            <md-filled-tonal-button id="home-restore-btn">
                <md-icon slot="icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="M479.23-420q-24.54 0-42.27-17.73-17.73-17.73-17.73-42.27 0-24.54 17.73-42.27Q454.69-540 479.23-540q24.54 0 42.27 17.73 17.73 17.73 17.73 42.27 0 24.54-17.73 42.27Q503.77-420 479.23-420Zm0 280q-130.54 0-226.77-85.73Q156.23-311.46 141.62-440h61.23Q218-336.38 296.27-268.19T479.23-200q117 0 198.5-81.5t81.5-198.5q0-117-81.5-198.5T479.23-760q-65.54 0-122.84 29.12-57.31 29.11-98.7 80.11h104.62v60H159.23v-203.08h60v94.77q48.69-57.46 116.62-89.19Q403.77-820 479.23-820q70.8 0 132.63 26.77t107.83 72.77q46 46 72.77 107.82 26.77 61.83 26.77 132.62t-26.77 132.63q-26.77 61.85-72.77 107.85-46 46-107.83 72.77Q550.03-140 479.23-140Z"/></svg>
                </md-icon>
                <span data-i18n="backup_restore_restore"></span>
            </md-filled-tonal-button>
        </div>
        <p class="backup-card-hint" id="telegram-hint" data-i18n="backup_restore_telegram_hint"></p>
    </div>

    <!-- Safe inset -->
    <div class="placeholder"></div>
</div>
