name: Release
permissions:
  contents: write
  actions: write

on:
  push:
    branches:
      - master
      - dev
    paths:
      - '.github/workflows/release.yml'
      - 'module/**'
      - 'webui/**'
      - 'update.json'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force change release file?'
        required: true
        type: boolean
        default: false

env:
  MODULE_NAME: 'ReSuSFS'

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ env.version_changed }}
      VERSION: ${{ env.VERSION }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 'latest'

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: 'lts/*'
        cache: 'pnpm'
        cache-dependency-path: webui/pnpm-lock.yaml

    - name: build webroot
      run: |
        cd webui
        pnpm install --frozen-lockfile
        pnpm build

    - name: Set variables
      id: setup
      run: |
        MODULE_DESC="SuSFS for KernelSU"
        CURRENT_VERSION_CODE=$(jq -r .versionCode update.json)
        PREVIOUS_VERSION_CODE=$(jq -r .versionCode <(git show HEAD~1:update.json))
        VERSION=$(jq -r .version update.json)
        PREVIOUS_VERSION=$(jq -r .version <(git show HEAD~1:update.json))
        echo "VERSION=${VERSION}" >> $GITHUB_ENV
        echo "PREVIOUS_VERSION=${PREVIOUS_VERSION}" >> $GITHUB_ENV
        COMMIT_ID=$(git rev-parse --short HEAD)
        ZIP_NAME=${{ env.MODULE_NAME }}_${VERSION}-${COMMIT_ID}
        echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

        if [ "$CURRENT_VERSION_CODE" -gt "$PREVIOUS_VERSION_CODE" ]; then
          echo "version_changed=true" >> $GITHUB_ENV
        else
          echo "version_changed=false" >> $GITHUB_ENV
        fi

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.ZIP_NAME }}
        path: 'module'

    - name: Download artifact
      if: env.version_changed == 'true' || inputs.force_release
      uses: actions/download-artifact@v8
      with:
        name: ${{ env.ZIP_NAME }}
        path: ${{ env.MODULE_NAME }}

    - name: Zip module for release
      if: env.version_changed == 'true' || inputs.force_release
      run: |
        cd ${{ env.MODULE_NAME }}
        zip -r ../${{ env.ZIP_NAME }}.zip .
        cd ..

    - name: Generate changelog
      id: changelog
      if: env.version_changed == 'true' || inputs.force_release
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        python .github/scripts/generate_changelog.py \
          --from "${{ env.PREVIOUS_VERSION }}" \
          --to HEAD \
          --version "${{ env.VERSION }}" \
          --output changelog_body.md

    - name: Update CHANGELOG.md
      if: env.version_changed == 'true'
      run: |
        echo -e "\n## [${VERSION}] - $(date +%Y-%m-%d)\n" >> CHANGELOG.md
        tail -n +2 changelog_body.md >> CHANGELOG.md

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        git add CHANGELOG.md
        git commit -m "docs: update CHANGELOG.md for ${VERSION}"
        git push

    - name: Create new release
      if: env.version_changed == 'true'
      uses: softprops/action-gh-release@v3
      with:
        files: "${{ env.ZIP_NAME }}.zip"
        tag_name: "${{ env.VERSION }}"
        name: "ReSuSFS ${{ env.VERSION }}"
        body_path: changelog_body.md
        draft: false
        prerelease: false

    - name: Force update latest release file
      if: ${{ inputs.force_release }}
      uses: softprops/action-gh-release@v3
      with:
        files: "${{ env.ZIP_NAME }}.zip"
        tag_name: "${{ env.VERSION }}"
        name: "ReSuSFS ${{ env.VERSION }}"
        body_path: changelog_body.md
