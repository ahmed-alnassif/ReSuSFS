<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReSuSFS</title>
    <link rel="stylesheet" href="./index.css" type="text/css">
    <script type="module" crossorigin src="./index.js"></script>
    <script type="module" crossorigin src="./utils/docs.js"></script>
</head>
<body>
    <!-- Header -->
    <div class="header blur-box" unresolved>
        <md-icon-button class="back-button">
            <md-icon flip-icon-in-rtl="true">
                <svg xmlns="http://www.w3.org/2000/svg" height="22px" viewBox="0 -960 960 960" width="22px"><path d="M640-80 240-480l400-400 71 71-329 329 329 329-71 71Z"/></svg>
            </md-icon>
        </md-icon-button>
        <div class="title-container">
            <div>
                <span id="title">ReSuSFS </span>
                <span id="version-text"></span>
            </div>
            <div class="file-name-editor">
                <span></span>
                <input type="text" id="file-name-input" autocapitalize="off" readonly>
                <span></span>
            </div>
        </div>
        <md-icon-button class="header-btn" id="line-wrap-btn" toggle aria-label="Enable line wrapping" aria-label-selected="Disable line wrapping" title="Toggle line wrapping">
            <md-icon><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="M588-132 440-280l148-148 56 58-50 50h96q29 0 49.5-20.5T760-390q0-29-20.5-49.5T690-460H160v-80h530q63 0 106.5 43.5T840-390q0 63-43.5 106.5T690-240h-96l50 50-56 58ZM160-240v-80h200v80H160Zm0-440v-80h640v80H160Z"/></svg></md-icon>
            <md-icon slot="selected"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="M588-132 440-280l148-148 56 58-50 50h96q29 0 49.5-20.5T760-390q0-29-20.5-49.5T690-460H160v-80h530q63 0 106.5 43.5T840-390q0 63-43.5 106.5T690-240h-96l50 50-56 58ZM160-240v-80h200v80H160Zm0-440v-80h640v80H160Z"/></svg></md-icon>
        </md-icon-button>
        <md-icon-button class="header-btn reboot-header-btn" id="reboot-btn" title="Reboot">
            <md-icon>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="M440-122q-121-15-200.5-105.5T160-440q0-66 26-126.5T260-672l57 57q-38 34-57.5 79T240-440q0 88 56 155.5T440-202v80Zm80 0v-80q87-16 143.5-83T720-440q0-100-70-170t-170-70h-3l44 44-56 56-140-140 140-140 56 56-44 44h3q134 0 227 93t93 227q0 120-79.5 210.5T520-122Z"/></svg>
            </md-icon>
        </md-icon-button>
        <md-icon-button class="header-btn" id="save-btn">
            <md-icon><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="M840-680v480q0 33-23.5 56.5T760-120H200q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h480l160 160Zm-80 34L646-760H200v560h560v-446ZM565-275q35-35 35-85t-35-85q-35-35-85-35t-85 35q-35 35-35 85t35 85q35 35 85 35t85-35ZM240-560h360v-160H240v160Zm-40-86v446-560 114Z"/></svg></md-icon>
        </md-icon-button>
    </div>

    <!-- Content -->
    <div class="content" id="content-container">
        <!-- page content will be loaded here -->
    </div>

    <!-- Custom background -->
    <div class="custom-bg" id="custom-bg">
        <img id="custom-bg-img" src="" alt="">
    </div>

    <!-- Rick Roll overlay -->
    <div class="overlay" id="rick-roll" unresolved>
        <div class="rr-content">
            <div class="rr-image-box">
                <div class="youtube-spinner"></div>
                <image id="rick-roll-image" src="https://i.ytimg.com/vi/dQw4w9WgXcQ/hq720.jpg?sqp=-oaymwEcCNAFEJQDSFXyq4qpAw4IARUAAIhCGAFwAcABBg==&amp;rs=AOn4CLDRxusbm2_TGTnDWEIhBTYW2cUQkw"></image>
            </div>
            <button class="close-rr-btn">
                <span id="rr-coundown">5</span>
                <span>&#10072;</span>
                <span>&#x2715;</span>
            </button>
        </div>
    </div>

    <!-- Prompt -->
    <div class="prompt-container" unresolved>
        <div class="prompt" id="prompt">
            <span class="prompt-text"></span>
            <md-text-button class="prompt-btn"></md-text-button>
        </div>
    </div>

    <!-- Bottom Bar -->
    <div class="bottom-bar blur-box" unresolved>
        <div class="bottom-bar-item" id="home" page="home" selected>
            <md-icon><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"><path d="M240-200h120v-240h240v240h120v-360L480-740 240-560v360Zm-80 80v-480l320-240 320 240v480H520v-240h-80v240H160Zm320-350Z"/></svg></md-icon>
            <md-icon slot="selected"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"><path d="M160-120v-480l320-240 320 240v480H560v-280H400v280H160Z"/></svg></md-icon>
            <div class="bottom-bar-item-text">
                <span data-i18n="footer_home"></span>
            </div>
        </div>
        <div class="bottom-bar-item" id="susfs" page="susfs">
            <md-icon><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"><path d="M480-80q-139-35-229.5-159.5T160-516v-244l320-120 320 120v244q0 152-90.5 276.5T480-80Zm0-84q97-30 162-118.5T718-480H480v-315l-240 90v207q1 3 2 8h238v316Z"/></svg></md-icon>
            <md-icon slot="selected"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"><path d="M480-80q-139-35-229.5-159.5T160-516v-244l320-120 320 120v244q0 152-90.5 276.5T480-80Z"/></svg></md-icon>
            <div class="bottom-bar-item-text">
                <span data-i18n="footer_susfs"></span>
            </div>
        </div>
        <div class="bottom-bar-item" id="userhub" page="userhub">
            <md-icon><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"><path d="M320-240 80-480l240-240 57 57-184 184 183 183-56 56Zm320 0-57-57 184-184-183-183 56-56 240 240-240 240Z"/></svg></md-icon>
            <md-icon slot="selected"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"><path d="M320-240 80-480l240-240 57 57-184 184 183 183-56 56Zm320 0-57-57 184-184-183-183 56-56 240 240-240 240Z" fill-opacity="1"/></svg></md-icon>
            <div class="bottom-bar-item-text">
                <span data-i18n="footer_userhub"></span>
            </div>
        </div>
        <div class="bottom-bar-item" id="more" page="more">
            <md-icon><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"><path d="M440-280h80v-240h-80v240Zm40-320q17 0 28.5-11.5T520-640q0-17-11.5-28.5T480-680q-17 0-28.5 11.5T440-640q0 17 11.5 28.5T480-600Zm0 520q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z"/></svg></md-icon>
            <md-icon slot="selected"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"><path d="M440-280h80v-240h-80v240Zm40-320q17 0 28.5-11.5T520-640q0-17-11.5-28.5T480-680q-17 0-28.5 11.5T440-640q0 17 11.5 28.5T480-600Zm0 520q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Z"/></svg></md-icon>
            <div class="bottom-bar-item-text">
                <span data-i18n="footer_more"></span>
            </div>
        </div>
    </div>

    <!-- Terminals and Editors -->
    <div class="constant-height slide-menu" id="edit-content">
        <div id="edit-input"></div>
    </div>

    <div class="constant-height blur-box slide-menu" id="action-terminal">
        <div class="terminal" id="action-terminal-content"></div>
        <div class="slide-menu-bottom-padding"></div>
    </div>

    <div class="constant-height blur-box slide-menu" id="logs-terminal">
        <div class="terminal" id="logs-terminal-content"></div>
        <div class="slide-menu-bottom-padding"></div>
    </div>

    <div class="document-content blur-box constant-height slide-menu" id="about-document">
        <div class="documents" id="about-document-content"></div>
        <div class="credit-marked">Markdown Parser by markedjs/marked</div>
        <div class="slide-menu-bottom-padding"></div>
    </div>

    <!-- Floating Action Buttons -->
    <div class="fab-container action-container" unresolved>
        <div class="action-group">
            <md-fab variant="primary" size="small" id="force-update-btn" class="force-update-button">
                <md-icon slot="icon">
                    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"><path d="m296-224-56-56 240-240 240 240-56 56-184-183-184 183Zm0-240-56-56 240-240 240 240-56 56-184-183-184 183Z"/></svg>
                </md-icon>
            </md-fab>
            <div class="action-stack">
                <md-fab variant="primary" id="action-btn" class="action-button">
                    <md-icon slot="icon">
                        <svg xmlns="http://www.w3.org/2000/svg" height="34px" viewBox="0 -960 960 960" width="34px"><path d="M320-200v-560l440 280-440 280Z"/></svg>
                    </md-icon>
                </md-fab>
                <md-fab variant="primary" size="small" id="reboot-terminal-btn" class="reboot-terminal-button">
                    <md-icon slot="icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="M440-122q-121-15-200.5-105.5T160-440q0-66 26-126.5T260-672l57 57q-38 34-57.5 79T240-440q0 88 56 155.5T440-202v80Zm80 0v-80q87-16 143.5-83T720-440q0-100-70-170t-170-70h-3l44 44-56 56-140-140 140-140 56 56-44 44h3q134 0 227 93t93 227q0 120-79.5 210.5T520-122Z"/></svg>
                    </md-icon>
                </md-fab>
                <md-fab variant="primary" id="close-terminal" class="action-button" variant="secondary">
                    <md-icon slot="icon">
                        <svg xmlns="http://www.w3.org/2000/svg" height="34px" viewBox="0 -960 960 960" width="34px"><path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/></svg>
                    </md-icon>
                </md-fab>
                <md-fab variant="primary" id="close-terminal" class="action-button" variant="secondary">
                    <md-icon slot="icon">
                        <svg xmlns="http://www.w3.org/2000/svg" height="34px" viewBox="0 -960 960 960" width="34px"><path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/></svg>
                    </md-icon>
                </md-fab>
            </div>
        </div>
    </div>

    <!-- Dialogs -->
    <div class="dialog-wrapper" unresolved>
        <!-- Enabled-features dialog (opened from the home page status box) -->
        <md-dialog id="features-dialog">
            <div slot="headline" data-i18n="features_title"></div>
            <div slot="content">
                <div class="features-meta">
                    <div class="features-meta-row">
                        <span data-i18n="features_version"></span>
                        <span id="features-version">-</span>
                    </div>
                    <div class="features-meta-row">
                        <span data-i18n="features_variant"></span>
                        <span id="features-variant">-</span>
                    </div>
                </div>
                <div class="features-list" id="features-list"></div>
            </div>
            <div slot="actions">
                <md-text-button class="close-btn" data-i18n="global_close"></md-text-button>
            </div>
        </md-dialog>

        <!-- New Script dialog (UserHub) -->
        <md-dialog id="new-script-dialog">
            <div slot="headline" data-i18n="userhub_new_script"></div>
            <div slot="content">
                <md-outlined-text-field id="new-script-name" placeholder="my-script.sh" style="width: 100%;"></md-outlined-text-field>
            </div>
            <div slot="actions">
                <md-text-button id="new-script-cancel" data-i18n="global_cancel"></md-text-button>
                <md-filled-button id="new-script-create" data-i18n="global_confirm"></md-filled-button>
            </div>
        </md-dialog>

        <!-- Language -->
        <md-dialog id="language-overlay">
            <div slot="headline" data-i18n="control_panel_language"></div>
            <div slot="content">
                <form id="language-form" method="dialog"></form>
            </div>
            <div slot="actions">
                <md-text-button class="docs-btn" id="translate-btn" data-type="translate" data-i18n="control_panel_add_language"></md-text-button>
                <md-text-button class="close-btn" value="cancel" data-i18n="global_close"></md-text-button>
            </div>
        </md-dialog>

        <!-- File Selector Dialog -->
        <md-dialog id="file-selector-dialog">
            <div slot="headline" class="file-selector-header">
                <md-icon-button class="file-selector-back-button">
                    <md-icon flip-icon-in-rtl="true">
                        <svg xmlns="http://www.w3.org/2000/svg" height="22px" viewBox="0 -960 960 960" width="22px"><path d="M640-80 240-480l400-400 71 71-329 329 329 329-71 71Z"/></svg>
                    </md-icon>
                </md-icon-button>
                <div class="current-path">/storage/emulated/0/Download</div>
            </div>
            <div slot="content">
                <div class="file-list"></div>
            </div>
            <div slot="actions">
                <md-text-button class="close-selector" data-i18n="global_close"></md-text-button>
            </div>
        </md-dialog>

        <!-- Documentation Overlays -->
        <md-dialog id="translate-docs" class="docs">
            <div slot="headline" data-i18n="control_panel_add_language"></div>
            <div slot="content">
                <div class="documents">
                    <div id="translate-content">Loading...</div>
                    <div class="credit-marked">Markdown Parser by markedjs/marked</div>
                </div>
            </div>
            <div slot="actions">
                <md-text-button class="close-btn" data-i18n="global_close"></md-text-button>
            </div>
        </md-dialog>

        <md-dialog id="usage-docs" class="docs">
            <div slot="headline" data-i18n="more_usage"></div>
            <div slot="content">
                <div class="documents">
                    <div id="usage-content">Loading...</div>
                    <div class="credit-marked">Markdown Parser by markedjs/marked</div>
                </div>
            </div>
            <div slot="actions">
                <md-text-button class="close-btn" data-i18n="global_close"></md-text-button>
            </div>
        </md-dialog>

        <md-dialog id="hiding-docs" class="docs">
            <div slot="headline" data-i18n="more_hiding"></div>
            <div slot="content">
                <div class="documents">
                    <div id="hiding-content">Loading...</div>
                    <div class="credit-marked">Markdown Parser by markedjs/marked</div>
                </div>
            </div>
            <div slot="actions">
                <md-text-button class="close-btn" data-i18n="global_close"></md-text-button>
            </div>
        </md-dialog>

        <md-dialog id="faq-docs" class="docs">
            <div slot="headline" data-i18n="more_faq"></div>
            <div slot="content">
                <div class="documents">
                    <div id="faq-content">Loading...</div>
                    <div class="credit-marked">Markdown Parser by markedjs/marked</div>
                </div>
            </div>
            <div slot="actions">
                <md-text-button class="close-btn" data-i18n="global_close"></md-text-button>
            </div>
        </md-dialog>

        <!-- About -->
        <md-dialog id="about-dialog">
            <div slot="headline" data-i18n="about_title"></div>
            <div slot="content">
                <div class="about-content">
                    <p class="about-name">ReSuSFS</p>
                    <p class="about-version" id="about-version-text"></p>
                    <div class="about-row">
                        <span data-i18n="about_author"></span>
                        <span><a href="#" id="about-author-link">Ahmed Al-Nassif</a></span>
                    </div>
                    <div class="about-row">
                        <span data-i18n="about_license"></span>
                        <span><a href="#" id="about-license-link">GPLv3</a></span>
                    </div>
                    <div class="about-row">
                        <span data-i18n="about_repo"></span>
                        <span><a href="#" id="about-repo-link">GitHub</a></span>
                    </div>
                </div>
            </div>
            <div slot="actions">
                <md-text-button class="close-btn" data-i18n="global_close"></md-text-button>
            </div>
        </md-dialog>
        <!-- Reboot confirmation -->
        <md-dialog id="reboot-dialog">
            <div slot="headline" data-i18n="reboot_dialog_title"></div>
            <div slot="content">
                <p data-i18n="reboot_dialog_message"></p>
            </div>
            <div slot="actions">
                <md-text-button class="close-btn" data-i18n="global_cancel"></md-text-button>
                <md-filled-button id="reboot-confirm-btn" data-i18n="global_reboot"></md-filled-button>
            </div>
        </md-dialog>
    </div>
</body>
</html>
