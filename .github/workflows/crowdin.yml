name: Crowdin XML Sync

on:
  push:
    branches: [ dev ]
    paths:
      - 'crowdin_xml.yml'
      - '.github/workflows/crowdin.yml'
      - 'webui/public/locales/strings/*.xml'
      - '**.md'
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  synchronize-with-crowdin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Crowdin Action
        uses: crowdin/github-action@v3
        with:
          upload_sources: true
          upload_translations: false
          download_translations: true
          skip_untranslated_strings: true

          create_pull_request: true
          localization_branch_name: l10n_crowdin_xml
          pull_request_title: 'webui/locales: sync translation from Crowdin'
          pull_request_labels: 'enhancement, webui, translation'
          pull_request_base_branch_name: 'dev'

          config: 'crowdin_xml.yml'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_API_TOKEN }}
          CROWDIN_API_TOKEN: ${{ secrets.CROWDIN_API_TOKEN }}
